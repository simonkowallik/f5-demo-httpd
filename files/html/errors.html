<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Pages Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .error-group {
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .error-group h2 {
            background: #E21D38;
            color: white;
            margin: 0;
            padding: 15px 20px;
            font-size: 18px;
        }
        
        .error-group ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0;
        }
        
        .error-group li {
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        
        .error-group li:nth-child(4n) {
            border-right: none;
        }
        
        .error-group li:last-child {
            border-right: none;
            border-bottom: none;
        }
        
        .error-group a {
            display: block;
            padding: 12px 15px;
            color: #E21D38;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s ease;
        }
        
        .error-group a:hover {
            background: #f9f9f9;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Error Pages Test</h1>
    
    <div class="error-group">
        <h2>500 Internal Server Error</h2>
        <ul>
            <li><a href="/error/500/asp">ASP</a></li>
            <li><a href="/error/500/jsp">JSP</a></li>
            <li><a href="/error/500/php">PHP</a></li>
            <li><a href="/error/500/xml">XML</a></li>
        </ul>
    </div>
    
    <div class="error-group">
        <h2>501 Not Implemented</h2>
        <ul>
            <li><a href="/error/501/asp">ASP</a></li>
            <li><a href="/error/501/jsp">JSP</a></li>
            <li><a href="/error/501/php">PHP</a></li>
            <li><a href="/error/501/xml">XML</a></li>
        </ul>
    </div>
    
    <div class="error-group">
        <h2>503 Service Unavailable</h2>
        <ul>
            <li><a href="/error/503/asp">ASP</a></li>
            <li><a href="/error/503/jsp">JSP</a></li>
            <li><a href="/error/503/php">PHP</a></li>
            <li><a href="/error/503/xml">XML</a></li>
        </ul>
    </div>
</body>
</html>
